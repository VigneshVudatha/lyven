<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="100%" stop-color="#0c0c0c" />
    </radialGradient>
    <linearGradient id="teeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGlow)" />

  <g filter="url(#shadow)">
    <path d="M 280,140 
             C 320,150 480,150 520,140 
             L 690,240 
             L 630,390 
             L 560,340 
             L 570,860 
             C 570,875 555,880 540,880 
             L 260,880 
             C 245,880 230,875 230,860 
             L 240,340 
             L 170,390 
             L 110,240 
             Z" 
          fill="url(#teeGrad)" stroke="#2b2b2b" stroke-width="2" />

    <!-- Back Neckline -->
    <path d="M 280,140 C 350,155 450,155 520,140" fill="none" stroke="#333" stroke-width="2" />
    <!-- Back Neck Tag -->
    <rect x="375" y="160" width="50" height="25" fill="#050505" stroke="#333" stroke-width="1" rx="2" />
    <text x="400" y="176" fill="#888" font-family="'Courier New', monospace" font-size="8" text-anchor="middle">LYVEN S</text>

    <!-- Dropped Shoulder Seams -->
    <line x1="280" y1="140" x2="200" y2="300" stroke="#1f1f1f" stroke-width="2" stroke-dasharray="6,4" />
    <line x1="520" y1="140" x2="600" y2="300" stroke="#1f1f1f" stroke-width="2" stroke-dasharray="6,4" />
  </g>

  <!-- Large Statement Back Print -->
  <g transform="translate(400, 480)" text-anchor="middle">
    <text y="-140" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" letter-spacing="8">
      KOHLI
    </text>

    <text y="70" fill="none" stroke="#e11d48" stroke-width="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="200" letter-spacing="-8" font-weight="900">
      18
    </text>
    <text y="70" fill="#ffffff" fill-opacity="0.9" font-family="'Impact', 'Arial Black', sans-serif" font-size="200" letter-spacing="-8" font-weight="900">
      18
    </text>

    <text y="140" fill="#a3a3a3" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="10">
      CHASING GREATNESS
    </text>

    <line x1="-120" y1="170" x2="120" y2="170" stroke="#333" stroke-width="1.5" />
    <text y="195" fill="#525252" font-family="'Courier New', monospace" font-size="10" letter-spacing="3">
      LYVEN APPAREL &bull; BENGALURU
    </text>
  </g>
</svg>
